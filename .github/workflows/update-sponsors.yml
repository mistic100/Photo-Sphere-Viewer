name: update-sponsors

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch: {}

concurrency:
  group: update-sponsors-${{ github.ref }}

jobs:
  update-sponsors:
    if: ${{ github.repository == 'mistic100/Photo-Sphere-Viewer' }}

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: update sponsors
        run: node build/update-sponsors.mjs
        env:
          GH_TOKEN: ${{ secrets.SPONSORS_TOKEN }}

      - name: commit changes
        run: |
          git add docs/index.md
          if ! git diff --cached --quiet -- docs/index.md; then
            git config user.email "noreply@github.com"
            git config user.name "github-actions"
            git commit -m "docs: update sponsors"
            git push
          fi
